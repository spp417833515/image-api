<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生图入口 · 工作台（方向 A）</title>
<style>
:root{
  /* ---------- 颜色 ---------- */
  --bg:#0a0a0c;
  --bg-2:#0f0f12;
  --panel:#121216;
  --card:#17171c;
  --card-2:#1f1f26;
  --card-3:#282830;
  --well:#0c0c0f;
  --line:#24242b;
  --line-2:#363640;
  --text:#ececf1;
  --text-2:#a5a5b2;
  --text-3:#6e6e7b;
  --accent:#b39bff;
  --accent-2:#7b8cff;
  --accent-ink:#0d0b18;
  --ok:#43d18d;
  --warn:#f2b43f;
  --danger:#ff6464;
  --r-t2i:#64b2ff;
  --r-ref:#45d2b4;
  --r-mask:#ff7fcd;
  --mask:#ff3fa4;
  --scrim:rgba(8,8,11,.74);
  --scrim-2:rgba(8,8,11,.5);
  --glow:rgba(255,255,255,.07);
  --shadow:0 18px 50px rgba(0,0,0,.6);
  --shadow-s:0 6px 18px rgba(0,0,0,.45);
  --demo-bg:#1b1606;
  --demo-bg-2:#221c08;
  --demo-line:#5c4b12;
  --demo-fg:#f2d374;
  --demo-fg-2:#b89e52;
  /* ---------- 字体 ---------- */
  --font:"Inter","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular","Cascadia Mono","Noto Sans Mono CJK SC",Menlo,Consolas,monospace;
  --fs-2xs:10px; --fs-xs:11px; --fs-s:12px; --fs-m:13px; --fs-l:15px; --fs-xl:18px; --fs-hero:44px;
  /* ---------- 间距 ---------- */
  --sp-0:2px; --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px;
  /* ---------- 圆角 ---------- */
  --r-xs:4px; --r-s:6px; --r-m:10px; --r-l:14px; --r-pill:999px;
  /* ---------- 尺寸 ---------- */
  --top-h:48px; --demo-h:36px; --col-left:388px; --col-film:118px;
  --head-h:44px; --foot-h:56px; --tile-h:72px; --tile-h-empty:46px; --btn-h:30px; --gen-h:52px; --stage-pad:28px;
  --mask-alpha:.55;
  /* ---------- 导出的蒙版 PNG：白 = 重画，黑 = 不动（数据值，不是界面色） ---------- */
  --mask-on:#fff; --mask-off:#000;
}
@media (max-width:1200px){
  :root{ --col-left:340px; --col-film:96px; --tile-h:62px; --stage-pad:20px; }
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs-m);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ic{flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- 外框 ---------- */
.app{position:fixed;inset:0 0 var(--demo-h) 0;display:grid;grid-template-rows:var(--top-h) minmax(0,1fr)}
.top{display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-4);border-bottom:1px solid var(--line);background:var(--bg-2)}
.brand{display:flex;align-items:center;gap:var(--sp-2);font-weight:650;font-size:var(--fs-l);letter-spacing:.04em}
.logo{width:26px;height:26px;border-radius:var(--r-s);background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:var(--accent-ink)}
.brand small{font-weight:400;color:var(--text-3);font-size:var(--fs-s);letter-spacing:0;margin-left:var(--sp-1)}
.status{margin-left:auto;display:flex;align-items:center;gap:var(--sp-2);height:var(--btn-h);padding:0 var(--sp-3);border:1px solid var(--line);border-radius:var(--r-pill);font-size:var(--fs-s);color:var(--text-2);background:var(--panel)}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.status.down{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.status.down .dot{background:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 22%,transparent)}
.status.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.status.warn .dot{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent)}
.status .sub{color:var(--text-3)}
.top{position:relative}
button.status{cursor:pointer}
button.status:hover,button.status.open{border-color:var(--line-2);background:var(--card)}
.status .ver{font-family:var(--mono);font-size:var(--fs-xs);color:var(--text)}
.status.down .ver,.status.warn .ver{color:inherit}
.status.busy .dot{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.pop{position:absolute;top:calc(var(--top-h) - var(--sp-1));right:var(--sp-4);width:340px;z-index:40;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-l);box-shadow:var(--shadow);padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3);font-size:var(--fs-s);color:var(--text-2)}
.pop[hidden]{display:none}
.pop-h{display:flex;align-items:center;gap:var(--sp-2);color:var(--text);font-weight:600;font-size:var(--fs-m)}
.pop-h .tag{margin-left:auto}
.pop-row{display:flex;flex-direction:column;gap:var(--sp-1)}
.pop-k{display:flex;justify-content:space-between;font-size:var(--fs-2xs);color:var(--text-3);letter-spacing:.06em}
.pop-v{color:var(--text);font-family:var(--mono);font-size:var(--fs-m)}
.pop-checks{display:flex;flex-direction:column;gap:var(--sp-1)}
.pop-checks span{display:flex;align-items:center;gap:var(--sp-2);color:var(--text)}
.pop-checks .ok .ic{color:var(--ok)}
.pop-checks .no .ic{color:var(--danger)}
.pop-checks .wait{color:var(--text-3)}
.pop-checks em{font-style:normal;color:var(--text-3);font-size:var(--fs-xs)}
.pop-routes{flex-direction:row;flex-wrap:wrap;column-gap:var(--sp-3)}
.pop-why{flex-basis:100%;padding-left:22px;font-family:var(--mono);font-size:var(--fs-2xs);line-height:1.5;color:var(--text-3);word-break:break-all}
.pop-op{color:var(--text);line-height:1.5}
.pop-cli{border-top:1px solid var(--line);padding-top:var(--sp-3);font-size:var(--fs-xs);color:var(--text-3);line-height:1.8}
.pop-cli code{font-family:var(--mono);color:var(--text-2);white-space:nowrap}

.work{display:grid;grid-template-columns:var(--col-left) minmax(0,1fr) var(--col-film);min-height:0}

/* ---------- 左栏：步骤 ---------- */
.left{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.left-head{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4) var(--sp-2);font-size:var(--fs-s);color:var(--text-2)}
.left-head b{color:var(--text);font-weight:600;font-size:var(--fs-m)}
.left-head .n{color:var(--text-3)}
.steps{flex:1;min-height:0;overflow-y:auto;padding:0 var(--sp-3) var(--sp-4);scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}

.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-2);transition:border-color .15s}
.card:hover{border-color:var(--line-2)}
.card.sel{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent)}
.card.bad{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 6%,var(--card));box-shadow:0 0 0 1px color-mix(in srgb,var(--danger) 30%,transparent)}
.card.running{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 24px color-mix(in srgb,var(--accent) 22%,transparent)}
.card.locked textarea,.card.locked input,.card.locked .tray,.card.locked .c-tools,.card.locked .more{pointer-events:none}
.card.locked .c-body{opacity:.72}
.c-head{display:flex;align-items:center;gap:var(--sp-2);min-height:24px}
.c-no{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:var(--fs-xs);font-weight:700;background:var(--card-3);color:var(--text)}
.card.sel .c-no{background:var(--accent);color:var(--accent-ink)}
.card.bad .c-no{background:var(--danger);color:var(--accent-ink)}
.c-size{font-size:var(--fs-xs);color:var(--text-3);font-variant-numeric:tabular-nums}
.c-sp{flex:1}
.c-body{display:flex;flex-direction:column;gap:var(--sp-2)}
.ib{width:24px;height:24px;display:grid;place-items:center;border:0;border-radius:var(--r-s);background:transparent;color:var(--text-3);padding:0}
.ib:hover{background:var(--card-3);color:var(--text)}

.tag{display:inline-flex;align-items:center;gap:var(--sp-1);height:20px;padding:0 var(--sp-2);border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:600;white-space:nowrap;color:var(--rc,var(--text-2));background:color-mix(in srgb,var(--rc,var(--text-2)) 14%,transparent);border:1px solid color-mix(in srgb,var(--rc,var(--text-2)) 32%,transparent)}
.tag.t2i{--rc:var(--r-t2i)} .tag.ref{--rc:var(--r-ref)} .tag.mask{--rc:var(--r-mask)} .tag.bad{--rc:var(--danger)}
.tag.ok{--rc:var(--ok)} .tag.warn{--rc:var(--warn)}
.tag.dim{opacity:.55}
.tag.mute{--rc:var(--text-3)}
.rdot{width:7px;height:7px;border-radius:50%;background:var(--rc);flex:none}
.rdot.t2i{--rc:var(--r-t2i)} .rdot.ref{--rc:var(--r-ref)} .rdot.mask{--rc:var(--r-mask)}

.st{display:inline-flex;align-items:center;gap:var(--sp-1);font-size:var(--fs-xs);color:var(--text-3);font-variant-numeric:tabular-nums}
.st.run{color:var(--accent);font-weight:600}
.st.ok{color:var(--ok)}
.st.fail{color:var(--danger);font-weight:600}
.st-thumb{width:26px;height:26px;border-radius:var(--r-xs);object-fit:cover;border:1px solid var(--line-2);cursor:pointer;display:block}
.st-thumb:hover{border-color:var(--accent)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 25%,transparent);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.c-prompt{width:100%;resize:none;min-height:56px;max-height:150px;border:1px solid var(--line);background:var(--well);border-radius:var(--r-m);padding:var(--sp-2) var(--sp-3);font-size:var(--fs-m);line-height:1.55;color:var(--text);outline:none}
.c-prompt::placeholder{color:var(--text-3)}
.c-prompt:focus{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}

.tray-lab{display:flex;justify-content:space-between;font-size:var(--fs-2xs);color:var(--text-3);letter-spacing:.04em}
.tray-lab .over{color:var(--danger);font-weight:700}
.tray{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:var(--sp-1)}
.tile{position:relative;height:var(--tile-h);border-radius:var(--r-s);border:1px solid var(--line);background:var(--well) center/cover no-repeat;overflow:hidden;cursor:grab;padding:0}
.tile:hover{border-color:var(--line-2)}
.tray.is-empty .tile{height:var(--tile-h-empty);flex-direction:row;gap:var(--sp-1)}
.tile.empty{border-style:dashed;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-0);color:var(--text-3);background:transparent;font-size:var(--fs-2xs)}
.tile.empty.ghost{opacity:.5}
.tile.empty.first{color:var(--text-2);border-color:var(--line-2)}
.tile.empty:hover{border-color:var(--accent);color:var(--accent);opacity:1}
.tile.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent)}
.tile.dragging{opacity:.35}
.t-badge{position:absolute;left:var(--sp-1);top:var(--sp-1);font-size:var(--fs-2xs);line-height:1;padding:var(--sp-0) var(--sp-1);border-radius:var(--r-xs);background:var(--scrim);color:var(--text);font-weight:600}
.tile.lead .t-badge{background:var(--accent);color:var(--accent-ink)}
.t-x{position:absolute;right:var(--sp-1);top:var(--sp-1);width:18px;height:18px;border-radius:50%;border:0;background:var(--scrim);color:var(--text);display:none;place-items:center;padding:0}
.tile:hover .t-x{display:grid}
.t-x:hover{background:var(--danger);color:var(--accent-ink)}
.tile.prev{border:1px dashed color-mix(in srgb,var(--accent) 65%,transparent);background-color:color-mix(in srgb,var(--accent) 9%,var(--well))}
.t-prev{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-1);font-size:var(--fs-2xs);color:var(--accent);font-weight:600}
.tile.prev.has .t-prev{inset:auto 0 0 0;flex-direction:row;padding:var(--sp-0) 0;background:var(--scrim)}
.tile.over{border:1px solid var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.tile.over::after{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--danger) 28%,transparent);pointer-events:none;z-index:1}
.tile .t-badge,.tile .t-x{z-index:2}
.tile.viewing{outline:2px solid var(--accent);outline-offset:1px}

.c-tools{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:var(--sp-1);height:var(--btn-h);padding:0 var(--sp-3);border-radius:var(--r-pill);border:1px solid var(--line-2);background:var(--card-2);color:var(--text-2);font-size:var(--fs-s);white-space:nowrap}
.chip:hover{color:var(--text);border-color:var(--text-3)}
.chip.on{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chip.sm{height:24px;padding:0 var(--sp-2);font-size:var(--fs-xs)}
.mask-ctl{display:flex;align-items:center;gap:var(--sp-1);margin-left:auto}
.mask-ctl .m-thumb{width:30px;height:30px;border-radius:var(--r-xs);border:1px solid color-mix(in srgb,var(--mask) 50%,var(--line));display:block;cursor:pointer}
.mask-ctl .lab{font-size:var(--fs-xs);color:var(--r-mask);margin:0 var(--sp-1)}
.mask-ctl .chip{height:24px;padding:0 var(--sp-2);font-size:var(--fs-xs)}
.mask-ctl .lab.run{color:var(--accent)} .mask-ctl .lab.warn{color:var(--warn)} .mask-ctl .lab.bad{color:var(--danger)} .mask-ctl .lab.mute{color:var(--text-3)}
.c-tools:empty{display:none}
.m-wait{font-size:var(--fs-xs);color:var(--text-3);margin-right:var(--sp-1)}
.f .chip.sm{height:24px}
.f[hidden]{display:none}

.c-msg:empty{display:none}
.msg{display:flex;gap:var(--sp-2);align-items:flex-start;font-size:var(--fs-s);line-height:1.55;color:var(--text)}
.msg .ic{color:var(--danger);margin-top:var(--sp-0)}
.msg .txt{flex:1;min-width:0}
.linkbtn{color:var(--accent);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:var(--fs-s)}
.raw-wrap{margin-top:var(--sp-2)}
.raw{font-family:var(--mono);font-size:var(--fs-xs);line-height:1.6;color:var(--text-2);background:var(--well);border:1px solid color-mix(in srgb,var(--danger) 35%,var(--line));border-radius:var(--r-s);padding:var(--sp-2) var(--sp-3);white-space:pre-wrap;word-break:break-all;margin:0}
.raw .rt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.raw.open .rt{display:block}
.raw-bar{display:flex;gap:var(--sp-3);margin-top:var(--sp-1);font-size:var(--fs-xs);color:var(--text-3)}
.raw-bar button{background:none;border:0;padding:0;color:var(--text-2);font-size:var(--fs-xs);display:inline-flex;align-items:center;gap:var(--sp-1)}
.raw-bar button:hover{color:var(--text)}
.raw-bar .src{margin-left:auto;font-family:var(--mono)}

.more{border-top:1px solid var(--line);margin:0 calc(var(--sp-3) * -1) calc(var(--sp-3) * -1);padding:0 var(--sp-3)}
.more summary{list-style:none;display:flex;align-items:center;gap:var(--sp-2);height:32px;font-size:var(--fs-xs);color:var(--text-3);cursor:pointer;user-select:none}
.more summary::-webkit-details-marker{display:none}
.more summary .ic{transition:transform .15s}
.more[open] summary .ic{transform:rotate(90deg)}
.more summary b{font-weight:600;color:var(--text-2)}
.more-sum{margin-left:auto;font-variant-numeric:tabular-nums}
.more-body{display:flex;flex-direction:column;gap:var(--sp-2);padding:0 0 var(--sp-3)}
.f{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-xs);color:var(--text-3)}
.f>span:first-child{width:44px;flex:none}
.f input{width:96px;height:28px;border:1px solid var(--line);background:var(--well);border-radius:var(--r-s);padding:0 var(--sp-2);font-family:var(--mono);font-size:var(--fs-s);color:var(--text);outline:none}
.f input.sz{width:68px}
.f input:focus{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.f .x{color:var(--text-3)}
.f em{font-style:normal;color:var(--warn);font-family:var(--mono);font-size:var(--fs-xs)}

.link-line{display:flex;align-items:center;justify-content:center;height:22px;color:var(--accent);position:relative}
.link-line::before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:1px dashed color-mix(in srgb,var(--accent) 60%,transparent)}
.link-line span{position:relative;background:var(--panel);padding:0 var(--sp-1);display:flex;align-items:center;gap:var(--sp-1);font-size:var(--fs-2xs)}
.gap{height:var(--sp-2)}
.add-step{margin-top:var(--sp-2);width:100%;height:40px;border:1px dashed var(--line-2);border-radius:var(--r-l);background:transparent;color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:var(--sp-2);font-size:var(--fs-m)}
.add-step:hover{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}

.dock{border-top:1px solid var(--line);padding:var(--sp-3);background:var(--bg-2);display:flex;flex-direction:column;gap:var(--sp-2)}
.dock-sum{display:flex;align-items:center;gap:var(--sp-1);font-size:var(--fs-xs);color:var(--text-3);flex-wrap:wrap;min-height:18px}
.dock-sum .arrow{color:var(--text-3)}
.dock-sum .r{display:inline-flex;align-items:center;gap:var(--sp-1);color:var(--text-2)}
.dock-sum .r.done{color:var(--text-3)}
.dock-sum .r.done .ic{color:var(--ok)}
.dock-sum .r.bad{color:var(--danger);font-weight:600}
.dock-sum .r.mute{color:var(--text-3)}
.gen{position:relative;height:var(--gen-h);border:0;border-radius:var(--r-m);background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);font-size:var(--fs-l);font-weight:750;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:var(--sp-2);overflow:hidden;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 25%,transparent)}
.gen:hover:not(:disabled){filter:brightness(1.07)}
.gen:disabled{background:var(--card-2);color:var(--text-3);cursor:not-allowed;box-shadow:none}
.gen.running:disabled{color:var(--text);cursor:progress}
.gen-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 45%,transparent),color-mix(in srgb,var(--accent-2) 45%,transparent));transition:width .2s}
.gen .gl{position:relative;display:flex;align-items:center;gap:var(--sp-2);font-variant-numeric:tabular-nums}
.gen kbd{position:absolute;right:var(--sp-3);font-family:var(--mono);font-size:var(--fs-2xs);opacity:.55;letter-spacing:0}
.dock-why{font-size:var(--fs-s);line-height:1.4;display:flex;align-items:center;gap:var(--sp-1);color:var(--text-3)}
.dock-why:empty{display:none}
.dock-why.bad{color:var(--danger)}
.dock-why.warn{color:var(--warn)}
.dock-why .linkbtn{font-size:var(--fs-s)}

/* ---------- 中间：画布 ---------- */
.center{display:grid;grid-template-rows:var(--head-h) minmax(0,1fr) var(--foot-h);min-width:0;min-height:0;background:var(--bg)}
.s-head{display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-4);border-bottom:1px solid var(--line);min-width:0}

<script>
/* ============================================================
   MOCK：模拟数据（演示用）。真实页面这些来自后端 /api/plan、/api/status、/api/generate 等接口：
   - GET  /api/status     → MOCK.status.*：在线 / 正在升级、版本、上次检查（只在升级、回滚时跑）、最近一次操作、
                            各路由现在能不能用（每次实时查）、limits（最多几张图、尺寸取整）、size_presets
   - GET  /api/history    → MOCK.history：之前出过的图，新的在前
   - POST /api/images     → MOCK.images：已经在后端的图（上传后、出图后都有 id）
   - POST /api/plan       → 每步 route / output / requested / reject / unavailable，由下面「后端替身」的 mockPlan 现算
   - POST /api/generate   → 只回 {job_id}；不合格 422（带 plan），不可用 503
   - GET  /api/jobs/{id}  → 进度、每步结果（图、实际尺寸、seed）、失败时的 ComfyUI 原文
   字段名、结构、枚举值都和接口契约 v1 一致；以 _ 开头的字段只给替身自己用，不是接口字段。
   ============================================================ */
const ROUTE = { t2i:'文生图', ref:'参考图编辑', mask:'蒙版改写' };   // 路由的中文名，只用来显示
const P1 = '画一只坐在雪地里的赤狐，金色侧光。';
const P2 = '把狐狸换成一只白色北极狐。';
const V_OLD = { tag:null, commit:'0b05cd8' }, V_NEW = { tag:'v0.42.5', commit:'483dae4' };
const MASK_FILE = 'models/model_patches/qwen_image_2.1_fun_controlnet_union_int8_convrot.safetensors';
const routesAll = (available, reason) => ({ t2i:{ available, reason }, ref:{ available, reason }, mask:{ available, reason } });
const STATUS_ONLINE = {
  backend:'comfyui', host:'127.0.0.1:8188', online:true, upgrading:null, version:V_NEW,
  last_check:{ at:'2026-10-26T06:02:00Z', version:V_NEW, items:[
    { name:'starts', label:'能启动',     ok:true, note:null },
    { name:'nodes',  label:'节点齐全',   ok:true, note:null },
    { name:'routes', label:'三条路试跑', ok:true, note:null } ] },
  last_operation:{ at:'2026-10-26T06:02:00Z', kind:'upgrade', from:V_OLD, to:V_NEW, result:'passed', note:null },
  routes:routesAll(true, null),
  limits:{ max_images:4, max_edge:1920, size_multiple:32, default_size:{ width:1024, height:1024 } },
  size_presets:[ { label:'1:1', width:1024, height:1024 }, { label:'16:9', width:1536, height:864 }, { label:'9:16', width:864, height:1536 } ],
};
const MOCK = {
  status: {                                   // ← GET /api/status 的几种情况
    online:    STATUS_ONLINE,
    down:      { ...STATUS_ONLINE, online:false, routes:routesAll(false, 'ComfyUI 没开') },
    nofile:    { ...STATUS_ONLINE, routes:{ ...routesAll(true, null), mask:{ available:false, reason:'缺少蒙版权重 ' + MASK_FILE } } },
    upgrading: { ...STATUS_ONLINE, online:false, upgrading:{ target:'v0.42.5', since:'2026-10-26T06:00:00Z' },
                 version:V_OLD, last_check:null, last_operation:null, routes:routesAll(false, 'ComfyUI 正在升级') },
  },
  images: [                                   // ← POST /api/images 的 201 返回体（演示里当作已经上传过的图）
    { id:'img_fox',     url:'assets/fox.jpg',      width:960, height:960 },
    { id:'img_arctic',  url:'assets/arctic.jpg',   width:960, height:960 },
    { id:'img_sheet',   url:'assets/sheet.jpg',    width:960, height:540 },
    { id:'img_photo',   url:'assets/photo.jpg',    width:960, height:544 },
    { id:'img_foxmask', url:'assets/fox-mask.png', width:960, height:960, _lit:true },   // 已涂好的蒙版：白色矩形盖住狐狸
  ],
  results: {                                  // ← GET /api/jobs/{id} 里每步的 image（演示里「之前跑出来的」）
    r1: { id:'img_r1', url:'assets/fox.jpg',    width:960, height:960, route:'t2i',  seed:428193 },
    r2: { id:'img_r2', url:'assets/arctic.jpg', width:960, height:960, route:'mask', seed:771052 },
  },
  history: { items:[                          // ← GET /api/history
    { id:'img_h2', url:'assets/photo.jpg', width:960, height:544, route:'ref', seed:551203, instruction:'照图 2 的真人摄影风格，重画图 1 的角色设定卡。',
      created_at:'2026-10-25T21:14:00+08:00', job_id:'job_7c1e', step:1 },
    { id:'img_h1', url:'assets/sheet.jpg', width:960, height:544, route:'ref', seed:190733, instruction:'把设定卡的配色换成深蓝 + 米白。',
      created_at:'2026-10-25T20:52:00+08:00', job_id:'job_7b90', step:1 },
  ] },
  fail_raw: 'torch.OutOfMemoryError: CUDA out of memory. Tried to allocate 2.00 GiB (GPU 0; 23.56 GiB total capacity)',
  outputs: { t2i:'assets/fox.jpg', mask:'assets/arctic.jpg', ref:'assets/photo.jpg', ref_fox:'assets/arctic.jpg' },   // 替身出图时按路由挑的示例图
};

/* ============================================================
   后端替身（演示用，真实页面没有）
   页面只通过下面 6 个 mock 函数和后端打交道，一个函数对应一个接口，入参和返回值的字段、结构和契约一致；
   都返回 Promise<{ status, body }>（status = HTTP 状态码，body = 响应 JSON）。真实页面把它们一对一换成 fetch。
     mockStatus()        → GET  /api/status
     mockHistory(limit)  → GET  /api/history?limit=50
     mockUpload(file)    → POST /api/images（multipart file）
     mockPlan(body)      → POST /api/plan
     mockGenerate(body)  → POST /api/generate
     mockJob(id)         → GET  /api/jobs/{id}
   BE 是替身自己的「后端状态」，页面渲染代码不读它（只有「演示状态」布置场景时写它）。
   路由和拒绝规则只在这里（planOf）有一份，页面里没有。
   ============================================================ */
const BE = { status:null, images:{}, jobs:{}, history:[], freeze:null, downFor:null };
const clone = o => JSON.parse(JSON.stringify(o));
const reply = (status, body) => Promise.resolve({ status, body:clone(body) });
const pub = o => Object.fromEntries(Object.entries(o).filter(([k]) => k[0] !== '_'));
/* 新 id：在替身已有的图和任务里查重，保证不会和演示数据（img_r1、img_r2…）撞 */
function newId(prefix){ let id; do id = prefix + Math.random().toString(36).slice(2, 10); while (BE.images[id] || BE.jobs[id]); return id; }
function beReset(){
  Object.assign(BE, { status:MOCK.status.online, images:{}, jobs:{}, history:[], freeze:null, downFor:null });
  [...MOCK.images, ...Object.values(MOCK.results), ...MOCK.history.items].forEach(im => { BE.images[im.id] = { ...im }; });
}

/* 替身 · GET /api/status */
function mockStatus(){
  if (BE.downFor !== null && BE.downFor-- <= 0){ BE.status = MOCK.status.online; BE.downFor = null; }   // 演示：点「重新检测」时 ComfyUI 已经打开了
  return reply(200, BE.status);
}

/* 替身 · GET /api/history?limit=50（新的在前） */
function mockHistory(limit = 50){ return reply(200, { items:BE.history.slice(0, limit) }); }

/* 替身 · POST /api/images（multipart: file=<png|jpg|webp>）→ 201 {id, url, width, height} / 422 {code:'bad_image'} */
async function mockUpload(file){
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch (_){ return reply(422, { code:'bad_image', message:'这张图打不开，换一张试试。' }); }
  const id = newId('img_'), url = URL.createObjectURL(file);
  BE.images[id] = { id, url, width:bmp.width, height:bmp.height, _bmp:bmp };
  return reply(201, { id, url, width:bmp.width, height:bmp.height });
}

/* 替身 · POST /api/plan（只规划不运行；页面实时调用）→ 200 {ok, steps:[{step, route, output, requested, reject, unavailable}]} */
function mockPlan(body){ return reply(200, planOf(body)); }

/* 替身 · POST /api/generate → 202 {job_id} / 422 {code:'rejected', message, plan} / 503 {code, message, raw} */
function mockGenerate(body){
  const plan = planOf(body);
  if (plan.steps.some(p => p.reject)) return reply(422, { code:'rejected', message:'有步骤要改一下', plan });
  const u = plan.steps.find(p => p.unavailable);
  if (u) return reply(503, { code:u.unavailable.code, message:UNAV_MSG[u.unavailable.code], raw:u.unavailable.message });
  const id = newId('job_');
  BE.jobs[id] = { id, state:'queued', first_step:body.first_step,
    steps:plan.steps.map(p => ({ step:p.step, route:p.route, state:'queued', progress:null, image:null, error:null })),
    _body:clone(body), _plan:plan };
  return reply(202, { job_id:id });
}

/* 规划：路由表 + 校验（真实页面这些在后端，页面不自己算） */
function planOf(body){
  const s = BE.status, L = s.limits, out = [];
  const snap = v => Math.max(L.size_multiple, Math.round(v / L.size_multiple) * L.size_multiple);
  body.steps.forEach((q, k) => {
    const imgs = q.images || [], im = id => BE.images[id];
    const base = imgs[0] === '$prev' ? (k > 0 ? out[k - 1].output : null) : im(imgs[0]) || null;
    const mk = q.mask ? im(q.mask) : null;
    let reject = null, route = null, output = null, requested = null, unavailable = null;
    const no = (code, message) => { reject = { code, message }; };
    if (imgs.includes('$prev') && k === 0) no('prev_on_first_step', '这一步前面没有图可接，不用「上一步的图」就行。');
    else if (imgs.length > L.max_images) no('too_many_images', `放了 ${imgs.length} 张图，最多 ${L.max_images} 张（「上一步的图」也算 1 张）。去掉 ${imgs.length - L.max_images} 张就行。`);
    else if (imgs.some(id => id !== '$prev' && !im(id)) || (q.mask && !mk)) no('unknown_image', '有张图找不到了，重新放一次。');
    else if (q.mask && !imgs.length) no('mask_without_image', '有蒙版但没有底图。放一张图，或者去掉蒙版。');
    else if (imgs.length && (q.width || q.height)) no('size_with_images', '带图时尺寸跟第 1 张图走，宽高不用填。');
    else if (mk && !maskLit(mk)) no('mask_empty', '蒙版是空的，没有要重画的地方。涂一点再生成。');
    else if (mk && base && (mk.width !== base.width || mk.height !== base.height)) no('mask_size_mismatch', '蒙版和底图大小对不上，重新涂一次。');
    else if (!String(q.instruction || '').trim()) no('empty_instruction', '还没写指令');
    if (!reject){
      route = !imgs.length ? 't2i' : q.mask ? 'mask' : 'ref';
      if (route === 't2i'){
        const w = q.width || L.default_size.width, h = q.height || L.default_size.height;
        output = { width:snap(w), height:snap(h) };
        if ((q.width || q.height) && (output.width !== w || output.height !== h)) requested = { width:w, height:h };
      } else if (base){
        const z = Math.min(1, L.max_edge / Math.max(base.width, base.height));

        : !s.online ? { code:'comfy_down', message:`连不上 ComfyUI（${s.host}）` }
        : !s.routes[route].available ? { code:'missing_file', message:s.routes[route].reason } : null;
    }

}
/* 蒙版里有没有要重画的地方：亮度 ≥ 0.5 的像素 */
function maskLit(m){
  if (m._lit === undefined){
    if (!m._bmp) return true;
    const c = document.createElement('canvas'); c.width = m.width; c.height = m.height;
    const x = c.getContext('2d'); x.drawImage(m._bmp, 0, 0);
    const d = x.getImageData(0, 0, c.width, c.height).data; m._lit = false;
    for (let p = 0; p < d.length; p += 4) if (.299 * d[p] + .587 * d[p + 1] + .114 * d[p + 2] >= 127.5){ m._lit = true; break; }

/* ---------- 左栏底部：生成 ---------- */
/* 「生成」跑哪几步：从第一个没完成的步骤开始；某一步的蒙版是在旧图上涂的，就只跑到它前一步，出了新图先让人看一眼 */
function runRange(){
  const k = S.steps.findIndex((st, i) => st.mask && waitsPrev(i));
  return k > 0 ? { upto:k - 1, after:k } : { upto:S.steps.length - 1, after:null };
}
/* 能不能跑（只看 /api/status 和 /api/plan 的结论） */
function gate(upto){
  const todo = pendingIdx(upto), al = icon('alert', 14), nums = a => a.map(i => i + 1).join('、');
  if (!todo.length) return { dis:true, why:'改哪一步，就从哪一步重跑' };
  if (S.status.upgrading) return { dis:true, tone:'bad', why:`${al}ComfyUI 正在升级，升完再生成` };
  if (!S.status.online) return { dis:true, tone:'bad', why:`${al}ComfyUI 没开，打开后再生成` };
  if (todo.some(i => !pl(i))) return { dis:true };
  const hard = todo.filter(i => { const r = rejectOf(S.steps[i], i); return r && !isSoft(r); });
  if (hard.length) return { dis:true, tone:'bad', why:`${al}第 ${nums(hard)} 步要改一下，改好就能生成` };
  const un = todo.filter(i => pl(i).unavailable);
  if (un.length) return { dis:true, tone:'bad', why:`${al}第 ${nums(un)} 步要用的${ROUTE[pl(un[0]).route]}现在用不了` };
  const soft = todo.filter(i => isSoft(rejectOf(S.steps[i], i)));
  if (soft.length) return { dis:true, why:S.steps.length > 1 ? `第 ${nums(soft)} 步还没写指令` : '写一句指令就能生成' };

}

  const verb = r0 && r0.state === 'failed' ? '重试' : '生成';
  if (todo.length === tot) return tot > 1 ? `${verb} · ${tot} 步` : verb;
  if (todo.length === 1) return `${verb}第 ${a} 步`;
  return b - a + 1 === todo.length ? `${verb}第 ${a}–${b} 步` : `从第 ${a} 步${verb} · ${todo.length} 步`;
}
function chainItem(st, i){
  if (isDone(st)) return `<span class="r done">${icon('check', 12)}${ROUTE[st.run.image.route]}</span>`;
  const r = rejectOf(st, i), rt = routeOf(i);
  if (r) return isSoft(r) ? `<span class="r mute">第 ${i + 1} 步待写指令</span>` : `<span class="r bad">第 ${i + 1} 步要改</span>`;
  return rt ? `<span class="r"><i class="rdot ${rt}"></i>${ROUTE[rt]}</span>` : `<span class="r mute">第 ${i + 1} 步</span>`;

const runningIdx = () => S.steps.findIndex(s => s.run && s.run.state === 'running');
function renderDock(){
  const chain = S.steps.map(chainItem).join(`<span class="arrow">→</span>`);

    label = ri >= 0 ? `第 ${ri + 1}/${S.steps.length} 步 · ${pct}%` : '排队中'; cls = 'running'; fill = pct;   // 按钮文字和填充条都是当前这一步的进度

/* ---------- 中间：画布 ---------- */
function resolveView(){
  const v = S.view;
  if (!v) return { empty:true };
  if (v.kind === 'history'){
    const h = S.history.find(x => x.id === v.hid);
    return h ? { label:`<b>历史</b> · ${when(h)} · 第 ${h.step} 步`, img:h, info:h } : { empty:true };
  }
  const i = stepIdx(v.id), st = S.steps[i];
  if (!st) return { empty:true };
  const res = isDone(st) ? st.run.image : null;
  if (res && (v.kind === 'result' || (v.kind === 'step' && !S.job))) return { label:`<b>第 ${i + 1} 步结果</b>`, img:res, info:res, st, i };
  const idx = v.kind === 'item' ? v.idx : 0, it = st.items[idx], p = pl(i), rt = routeOf(i);
  if (it){
    const lead = idx === 0, what = lead && rt === 'mask' ? '底图' : `图 ${idx + 1}`;
    const base = { st, i, idx, what, out:lead && p ? p.output : null, mask:lead ? st.mask : null };
    if (it.kind === 'prev'){
      const r = prevImage(i), label = `<b>第 ${i + 1} 步</b> · ${what}（上一步的图）`;
      if (r) return { ...base, label, img:r, canPaint:lead };
      const po = pl(i - 1) && pl(i - 1).output, sz = po || S.status.limits.default_size;   // 占位框按上一步的预计出图尺寸
      return { ...base, label, ph:{ width:sz.width, height:sz.height, known:!!po, t:`第 ${i} 步的图`, s:'还没出图' }, waitPrev:lead };
    }
    return { ...base, label:`<b>第 ${i + 1} 步</b> · ${what}`, img:it, canPaint:lead };
  }
  if (S.steps.length === 1 && !st.instruction.trim() && !st.width && !st.height) return { empty:true, st, i, label:`<b>第 ${i + 1} 步</b>` };
  const o = p && p.output, sz = o || S.status.limits.default_size, rej = rejectOf(st, i);
  return { label:`<b>第 ${i + 1} 步</b>${rt ? ' · ' + ROUTE[rt] : ''}`, st, i, t2i:true,
           ph:{ width:sz.width, height:sz.height, known:!!o, t:o ? `${o.width} × ${o.height}` : rej && !isSoft(rej) ? '这一步要改一下' : '写一句指令',
                s:o ? '点「生成」出图' : rej && !isSoft(rej) ? '看左边卡片上的说明' : '写好就能出图' } };
}

/* 图放在画布中间；顶上有横幅 / 画笔条时让开，不压住图 */

/* ============================================================
   蒙版：每步一张离屏画板，存「涂过的地方 = 不透明的蒙版色」。
   id = 最近一次上传（POST /api/images）拿到的图片 id；dirty = 上传后又涂过

const imgCache = {};
function getImg(src, cb){
  let im = imgCache[src];
  if (!im){ im = imgCache[src] = new Image(); im.src = src; }
  if (im.complete && im.naturalWidth) cb && cb(im); else im.addEventListener('load', () => cb && cb(im), { once:true });
  return im;
}
function newMask(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return { canvas:c, w, h, id:null, dirty:false }; }
/* 画板 → 黑白 PNG（白 = 重画），交给 POST /api/images */
function maskPng(m){
  const c = document.createElement('canvas'); c.width = m.w; c.height = m.h;
  const x = c.getContext('2d');
  x.drawImage(m.canvas, 0, 0);
  x.globalCompositeOperation = 'source-in'; x.fillStyle = cssVar('--mask-on'); x.fillRect(0, 0, m.w, m.h);
  x.globalCompositeOperation = 'destination-over'; x.fillStyle = cssVar('--mask-off'); x.fillRect(0, 0, m.w, m.h);
  return new Promise(ok => c.toBlob(ok, 'image/png'));
}
function drawMaskThumbs(){
  document.querySelectorAll('canvas[data-mthumb]').forEach(c => {
    const i = stepIdx(c.dataset.mthumb), st = S.steps[i]; if (!st || !st.mask) return;
    const x = c.getContext('2d'), W = c.width, H = c.height, m = st.mask, b = leadImage(i);
    x.clearRect(0, 0, W, H); x.fillStyle = cssVar('--well'); x.fillRect(0, 0, W, H);
    const k = Math.min(W / m.w, H / m.h), dw = m.w * k, dh = m.h * k, ox = (W - dw) / 2, oy = (H - dh) / 2;
    const paint = () => { x.globalAlpha = .75; x.drawImage(m.canvas, ox, oy, dw, dh); x.globalAlpha = 1; };
    if (fits(m, b)) getImg(b.url, im => { x.drawImage(im, ox, oy, dw, dh); paint(); });
    else { x.fillStyle = cssVar('--card-3'); x.fillRect(ox, oy, dw, dh); paint(); }
  });
}
let drawing = null;
function maskPoint(e){
  const st = stepById(S.view.id), c = st.mask.canvas, r = c.getBoundingClientRect();
  return { x:(e.clientX - r.left) / r.width * c.width, y:(e.clientY - r.top) / r.height * c.height, st, c };
}
function strokeTo(p, from){
  const x = p.c.getContext('2d');
  x.globalCompositeOperation = S.brush.erase ? 'destination-out' : 'source-over';
  x.strokeStyle = cssVar('--mask'); x.lineWidth = S.brush.size; x.lineCap = x.lineJoin = 'round';
  x.beginPath(); x.moveTo(from.x, from.y); x.lineTo(p.x, p.y); x.stroke();
  x.globalCompositeOperation = 'source-over';
  p.st.mask.dirty = true;
}
function moveCursor(e){
  const cur = $('#cursor'), f = $('#frame'); if (!cur || !f || S.mode !== 'mask') return;
  const r = f.getBoundingClientRect(), d = S.brush.size * r.width / (+f.dataset.w);
  cur.style.display = 'block'; cur.style.width = cur.style.height = d + 'px';
  cur.style.left = (e.clientX - r.left) + 'px'; cur.style.top = (e.clientY - r.top) + 'px';
}
/* 开始涂：蒙版只能涂在已经有的图上（没有图时入口不会出现） */
function startPaint(st){
  if (!st) return;
  const b = leadImage(stepIdx(st.id)); if (!b) return;
  if (!fits(st.mask, b)) st.mask = newMask(b.width, b.height);   // 新蒙版（或尺寸对不上时换一张空白的）先不上传、不规划，点「涂好了」再说
  select(st.id, { kind:'item', id:st.id, idx:0 }); S.mode = 'mask'; S.brush.erase = false;
}
/* 结束涂：explicit = 点了「涂好了」→ 导出上传、重新规划（空的由 /api/plan 回 mask_empty）。

async function endPaint(explicit){
  const st = stepById(S.view.id), m = st && st.mask; S.mode = 'view';
  if (!m) return;
  if (!m.id && !m.dirty && !explicit){ st.mask = null; return; }
  if (m.id && !m.dirty) return;
  const r = await mockUpload(await maskPng(m));
  if (r.status !== 201){ toast(r.body.message); return; }
  if (st.mask === m){ m.id = r.body.id; m.dirty = false; }
  await replan(); renderAll();
}

/* ============================================================
   交互
   ============================================================ */
function select(id, view){
  const v = view || { kind:'step', id };
  if (S.mode === 'mask' && !(v.kind === 'item' && v.idx === 0 && v.id === S.view.id)) endPaint(false);
  S.sel = id; S.view = v;
}
/* 改了某一步的输入：这一步的结果作废；后面「用上一步的图」的步骤跟着作废（它们的蒙版留着）。返回是否有变化 */
function touch(st){
  if (!st || S.job) return false;
  let changed = false;
  for (let j = stepIdx(st.id); j < S.steps.length; j++){
    const s = S.steps[j];
    if (j > stepIdx(st.id) && !(changed && s.items.some(it => it.kind === 'prev'))) break;
    if (s.run){ s.run = null; changed = true; }
  }
  return changed;
}
async function addFiles(sid, files, at){
  if (S.job) return;
  const st = stepById(sid) || S.steps[0];
  const list = [...files].filter(f => f.type.startsWith('image/')); if (!list.length) return;
  const res = await Promise.all(list.map(f => mockUpload(f)));
  const bad = res.find(r => r.status !== 201); if (bad) toast(bad.body.message);
  const items = res.filter(r => r.status === 201).map(r => ({ kind:'img', ...r.body }));
  if (!items.length || !stepById(st.id)) return;
  touch(st);
  if (at === undefined) st.items.push(...items); else st.items.splice(at, 0, ...items);
  select(st.id); update();
}
function continueFrom(x){
  /* 「接着改」：开新一轮，把这张图带进第 1 步当图 1；之前的结果都在历史里 */
  clearTimeout(timer);
  const st = step({ items:[{ kind:'img', id:x.id, url:x.url, width:x.width, height:x.height }] });
  S.mode = 'view'; S.steps = [st]; S.job = null; select(st.id);
  update().then(() => { toast('已把这张图带进新的一步'); const ta = $(`.card[data-step="${st.id}"] textarea`); if (ta) ta.focus(); });

/* 生成：POST /api/generate 拿 job_id，再轮询 GET /api/jobs/{id}。upto / after 给「只跑到前面某一步」用 */
async function startRun(upto, after){
  if (S.job) return;
  if (upto === undefined) ({ upto, after } = runRange());
  if (S.mode === 'mask') await endPaint(true);      // 涂到一半直接点生成：先当「涂好了」
  await replan();
  const g = gate(upto);
  if (g.dis){ renderAll(); if (g.why) toast(g.why.replace(/<[^>]+>/g, '')); return; }
  S.job = { segs:segments(upto), si:0, after:after === undefined ? null : after, id:null, shown:false };
  S.fresh = new Set();
  sendSeg();
}
async function sendSeg(){
  const J = S.job, seg = J.segs[J.si];
  const r = await mockGenerate(bodyFor(seg));
  if (S.job !== J) return;
  if (r.status !== 202){
    S.job = null;
    if (r.status === 422) r.body.plan.steps.forEach(p => { PLAN[p.step - 1] = p; });
    else { S.status = (await mockStatus()).body; await replan(); }
    renderAll(); toast(r.body.message); return;
  }
  J.id = r.body.job_id; J.shown = false;
  poll();
}
async function poll(){
  const J = S.job; if (!J || !J.id) return;
  const job = (await mockJob(J.id)).body; if (S.job !== J) return;
  let fresh = null;
  job.steps.forEach(js => { const st = S.steps[js.step - 1]; if (!st) return; if (js.state === 'done' && !isDone(st)) fresh = js.image.id; st.run = js; });
  if (fresh){ S.history = (await mockHistory()).body.items; S.fresh.add(fresh); if (S.job !== J) return; }
  if (job.state === 'queued' || job.state === 'running'){
    const ri = runningIdx();
    if (!J.shown || fresh || (ri >= 0 && S.steps[ri].id !== S.sel)){
      J.shown = true; if (ri >= 0) select(S.steps[ri].id);
      await replan(); if (S.job !== J) return; renderAll();
    } else updateProgress();
    timer = setTimeout(poll, 180); return;
  }
  if (job.state === 'done' && J.si + 1 < J.segs.length){ J.si++; await replan(); sendSeg(); return; }
  S.job = null; await replan();
  if (job.state === 'failed'){
    /* 某步失败：停下，前面出的图保留；选中失败的那步，画布先看前面最后一张图 */
    const f = job.steps.find(x => x.state === 'failed'), fi = f.step - 1;
    const good = S.steps.map((s, k) => k).filter(k => k < fi && isDone(S.steps[k])).pop();
    select(S.steps[fi].id, good !== undefined ? { kind:'result', id:S.steps[good].id } : undefined);
    renderAll(); toast(`第 ${f.step} 步失败`); return;
  }
  const nx = J.after !== null && S.steps[J.after];
  if (nx && nx.mask){         // 蒙版是在旧图上涂的：切过去，旧蒙版叠在新图上，先看一眼；尺寸变了就得重新涂（看规划）
    const p = pl(J.after), mis = !!(p && p.reject && p.reject.code === 'mask_size_mismatch');
    select(nx.id, { kind:'item', id:nx.id, idx:0 }); renderAll(); toast(mis ? '新图尺寸变了，蒙版要重新涂' : '新图出来了，蒙版还是之前涂的，看一眼再接着跑'); return;

  if (nx){ startPaint(nx); renderAll(); toast(`第 ${J.after} 步出图了，涂要重画的地方`); return; }   // 「先出第 n 步的图」：切到下一步，直接能涂

}
async function recheck(){

async function copyText(t){

let toastT;
function toast(t){ const el = $('#toast'); if (!el) return; el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2200); }
function autoGrow(t){ t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 2, 150) + 'px'; }

document.addEventListener('click', e => {

  }
  const act = a.dataset.act, idx = a.dataset.idx !== undefined ? +a.dataset.idx : null;
  if (['rm-item', 'toggle-prev', 'drop-mask', 'repaint', 'seed-rand', 'seed-clear', 'clear-size', 'preset'].includes(act)) touch(st);
  switch (act){
    case 'ver': S.popOpen = !S.popOpen; renderTop(); return;
    case 'preset': st.width = a.dataset.w; st.height = a.dataset.h; break;
    case 'pick': S.pickFor = sid || S.sel; $('#pick').click(); return;
    case 'rm-item': e.stopPropagation(); st.items.splice(idx, 1); if (S.view.kind === 'item') select(sid); break;
    case 'view-item': select(sid, { kind:'item', id:sid, idx }); break;
    case 'toggle-prev': { const k = st.items.findIndex(it => it.kind === 'prev'); if (k >= 0) st.items.splice(k, 1); else st.items.unshift(PREV()); break; }
    case 'paint': startPaint(st || stepById(S.view.id)); break;
    case 'drop-mask': { const s2 = st || stepById(S.view.id); if (painting(s2)) S.mode = 'view'; s2.mask = null; break; }
    case 'repaint': { const s2 = st || stepById(S.view.id); touch(s2); if (painting(s2)) S.mode = 'view'; s2.mask = null; startPaint(s2); break; }   // 在现在的底图上换一张空白蒙版
    case 'clear-size': st.width = st.height = ''; break;
    case 'seed-rand': st.seed = String(Math.floor(Math.random() * 1e6)); break;
    case 'seed-clear': st.seed = ''; break;
    case 'del-step': {

      select(stepById(S.sel) ? S.sel : S.steps[Math.max(0, i - 1)].id); break;

      update().then(() => { const ta = $(`.card[data-step="${ns.id}"] textarea`); if (ta){ ta.focus(); ta.scrollIntoView({ block:'nearest' }); } }); return; }

    case 'mask-clear': { const s2 = stepById(S.view.id); if (s2 && s2.mask){ s2.mask.canvas.getContext('2d').clearRect(0, 0, s2.mask.w, s2.mask.h); s2.mask.dirty = true; } touch(s2); break; }

});
document.addEventListener('input', e => {

/* 拖动：图块换顺序 / 拖文件进托盘或画布 */
let dragSrc = null;
document.addEventListener('dragstart', e => {
  const t = e.target.closest && e.target.closest('.tile[draggable]'); if (!t) return;
  dragSrc = { sid:t.closest('.card').dataset.step, idx:+t.dataset.idx }; t.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'tile');
});
document.addEventListener('dragend', () => { dragSrc = null; document.querySelectorAll('.dragging,.drag-over').forEach(x => x.classList.remove('dragging', 'drag-over')); });
document.addEventListener('dragover', e => {
  const t = e.target.closest && (e.target.closest('.tile') || e.target.closest('.tray') || e.target.closest('#stage'));
  if (!t) return; e.preventDefault();
  document.querySelectorAll('.drag-over').forEach(x => x !== t && x.classList.remove('drag-over')); t.classList.add('drag-over');
});
document.addEventListener('drop', e => {
  const tile = e.target.closest && e.target.closest('.tile'), tray = e.target.closest && e.target.closest('.tray'), stg = e.target.closest && e.target.closest('#stage');
  if (!tile && !tray && !stg) return; e.preventDefault();
  document.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'));
  const card = e.target.closest('.card'), sid = card ? card.dataset.step : S.sel;
  if (dragSrc && card){
    if (S.job){ dragSrc = null; return; }
    const from = stepById(dragSrc.sid), to = stepById(sid); touch(from); touch(to);
    const it = from.items.splice(dragSrc.idx, 1)[0];
    let at = tile && tile.dataset.idx !== undefined ? +tile.dataset.idx : to.items.length;
    if (at > to.items.length) at = to.items.length;
    to.items.splice(at, 0, it); dragSrc = null; select(sid); update(); return;
  }
  if (e.dataTransfer.files.length) addFiles(sid, e.dataTransfer.files, tile && tile.dataset.idx !== undefined ? +tile.dataset.idx : undefined);
});
/* 画笔：每一笔抬起后立刻重画整页（卡片上的蒙版状态跟着变） */
document.addEventListener('pointerdown', e => {
  if (S.mode !== 'mask' || !e.target.closest('#frame')) return;
  e.preventDefault(); const p = maskPoint(e); drawing = p; strokeTo(p, p); e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove', e => { moveCursor(e); if (!drawing) return; const p = maskPoint(e); strokeTo(p, drawing); drawing = p; });
document.addEventListener('pointerup', () => { if (drawing){ const st = drawing.st; drawing = null; touch(st); update(); } });

new ResizeObserver(fitFrame).observe($('#stage'));
window.addEventListener('hashchange', () => load(location.hash.slice(1)));

function icon(n, s = 16){
  return `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[n] || ''}"/></svg>`;
}

/* ---------- 启动 ---------- */
$('#logo').innerHTML = icon('sparkle', 16);
$('#demo').insertAdjacentHTML('beforeend', DEMO.map(([k, t]) => `<button data-state="${k}">${t}</button>`).join(''));
$('#demo').addEventListener('click', e => {
  const b = e.target.closest('button[data-state]'); if (!b) return;
  if (location.hash === '#' + b.dataset.state) load(b.dataset.state); else location.hash = b.dataset.state;
});
load(location.hash.slice(1) || 'blank');
</script>
