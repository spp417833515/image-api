[project]
name = "imagegen"
version = "0.1.0"
description = "生图核心：只看输入项路由到文生图 / 参考图编辑 / 蒙版改写，多步接力，生图后端可插拔（内置 ComfyUI），ComfyUI 版本管理"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "pillow>=11",
    "pydantic>=2.9",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
